apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: orders
  template: 
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: hashicorp/http-echo:latest
          args: ["-text=esc bash orders", "-listen=:5678"]
          ports:
            - containerPort: 5678
